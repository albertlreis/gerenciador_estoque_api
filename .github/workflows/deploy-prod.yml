name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run production migrations during deploy
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-gerenciador-estoque-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      LOG_CHANNEL: testing_null

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch master

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, exif, gd, iconv, intl, pdo_mysql, simplexml, zip
          tools: composer:v2

      - name: Resolve Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Start MySQL
        run: |
          docker rm -f estoque-test-mysql >/dev/null 2>&1 || true
          docker run -d \
            --name estoque-test-mysql \
            --log-driver=none \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=estoque_test \
            -e MYSQL_USER=dev \
            -e MYSQL_PASSWORD=troque-esta-senha-dev \
            -p 3306:3306 \
            --health-cmd="MYSQL_PWD=root mysqladmin ping -h 127.0.0.1 -uroot" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=10 \
            mysql:8.0

          for attempt in {1..60}; do
            status="$(docker inspect -f '{{.State.Health.Status}}' estoque-test-mysql 2>/dev/null || true)"
            if [ "${status}" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          echo "MySQL container did not become healthy"
          exit 1

      - name: Prepare environment
        run: |
          cp .env.testing.example .env.testing
          cp .env.testing.example .env
          composer install --no-interaction --prefer-dist

      - name: Enable MySQL trigger creation in CI
        run: |
          mysql_container="$(docker ps --filter "name=estoque-test-mysql" --format '{{.ID}}' | head -n 1)"

          if [ -z "${mysql_container}" ]; then
            echo "MySQL service container not found"
            exit 1
          fi

          docker exec "${mysql_container}" sh -lc "MYSQL_PWD=root mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators = 1;'"
          docker exec "${mysql_container}" sh -lc "MYSQL_PWD=root mysql -uroot -e \"SHOW VARIABLES LIKE 'log_bin_trust_function_creators';\""

      - name: Run tests
        run: composer test:full

      - name: Validate deployment rollback
        run: bash tests/Deployment/deploy_rollback_test.sh

      - name: Build and verify production image
        run: |
          docker build --pull --file Dockerfile.prod --tag sierra-estoque-api:ci .
          docker run --rm --entrypoint php sierra-estoque-api:ci -r '
            $gd = gd_info();
            if (!function_exists("imagecreatefromwebp") || !($gd["JPEG Support"] ?? false) || !($gd["WebP Support"] ?? false)) {
                fwrite(STDERR, "GD production image is missing JPEG/WebP support.\n");
                exit(1);
            }
          '
          docker run --rm --user www-data --entrypoint sh sierra-estoque-api:ci -lc '
            test -w /var/www/html/storage/logs
            test -w /var/www/html/bootstrap/cache
          '

      - name: Stop MySQL
        if: always()
        run: docker rm -f estoque-test-mysql >/dev/null 2>&1 || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      RUN_MIGRATIONS: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_migrations) }}

    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add droplet to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Trigger deploy on droplet
        id: deploy
        continue-on-error: true
        run: |
          deploy_args=""
          if [ "${RUN_MIGRATIONS}" = "true" ]; then
            deploy_args="--migrate"
          fi

          compose_fix_cmd="if [ -f docker-compose.yml ]; then cp docker-compose.yml docker-compose.yml.bak-version-obsolete && sed -i '/^version:/d' docker-compose.yml; fi"
          remote_command="cd /home/docker/acadsoft/sierra-estoque && rm -f .deploy-state/estoque-api.rollback && repo_git_dir=\$(find . -maxdepth 3 -type d -name .git -print -quit) && repo_dir=\${repo_git_dir%/.git} && test -n \"\${repo_dir}\" && previous_sha=\$(git -C \"\${repo_dir}\" rev-parse HEAD) && ./html/scripts/backup-production.sh && git -C \"\${repo_dir}\" fetch origin master && git -C \"\${repo_dir}\" reset --hard origin/master && git -C \"\${repo_dir}\" clean -fd && ${compose_fix_cmd} && AUTO_ROLLBACK=true ROLLBACK_GIT_SHA=\${previous_sha} bash ./html/scripts/deploy.sh ${deploy_args} && docker-compose -f docker-compose.yml up -d --no-deps nginx && docker update --restart always sierra_estoque_nginx >/dev/null && docker exec sierra_estoque_app sh -lc 'mkdir -p /var/www/html/storage/framework/cache/data /var/www/html/storage/logs /var/www/html/bootstrap/cache && chown -R www-data:www-data /var/www/html/storage/framework/cache /var/www/html/storage/logs /var/www/html/bootstrap/cache && chmod -R ug+rwX /var/www/html/storage/framework/cache /var/www/html/storage/logs /var/www/html/bootstrap/cache'"

          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "${remote_command}"

      - name: Verify production API health
        id: api-health
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          health_url="https://estoque.sierra.acadsoft.com.br/api/v1/health"

          for attempt in {1..12}; do
            http_code="$(curl --silent --show-error --location --output health-response.json --write-out '%{http_code}' "${health_url}" || true)"

            if [[ "${http_code}" =~ ^2[0-9][0-9]$ ]] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' health-response.json; then
              cat health-response.json
              exit 0
            fi

            echo "Health check attempt ${attempt}/12 failed with HTTP ${http_code:-unavailable}."
            cat health-response.json 2>/dev/null || true
            sleep 5
          done

          echo "Production API did not become healthy at ${health_url}."
          exit 1

      - name: Roll back failed production candidate
        if: steps.deploy.outcome == 'failure' || steps.api-health.outcome == 'failure'
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /home/docker/acadsoft/sierra-estoque && if ! AUTO_ROLLBACK=true bash ./html/scripts/deploy.sh --rollback; then docker exec sierra_estoque_app php artisan down --render='errors::503' || true; exit 1; fi"

          for attempt in {1..12}; do
            rollback_health="$(curl --fail --show-error --silent --location \
              --connect-timeout 10 --max-time 20 \
              https://estoque.sierra.acadsoft.com.br/api/v1/health || true)"

            if printf '%s' "${rollback_health}" | grep -Eq \
              '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi

            echo "Waiting for the restored API (${attempt}/12)..."
            sleep 5
          done

          echo "The restored API did not become healthy."
          exit 1

      - name: Fail workflow after automatic rollback
        if: always() && (steps.deploy.outcome == 'failure' || steps.api-health.outcome == 'failure')
        run: |
          echo "Production candidate failed during deploy or health check and was rolled back."
          exit 1

      - name: Verify shared production services
        run: |
          curl --fail --show-error --silent --location \
            --connect-timeout 10 --max-time 20 \
            https://sierra.acadsoft.com.br/ >/dev/null

          auth_health="$(curl --fail --show-error --silent --location \
            --connect-timeout 10 --max-time 20 \
            https://auth.sierra.acadsoft.com.br/api/v1/health)"

          printf '%s' "${auth_health}" | grep -Eq \
            '"status"[[:space:]]*:[[:space:]]*"ok"'
          printf '%s' "${auth_health}" | grep -Eq \
            '"service"[[:space:]]*:[[:space:]]*"autenticacao-api"'
