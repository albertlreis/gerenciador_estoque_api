services:
  app:
    image: sierra-estoque-app:latest
    container_name: sierra_estoque_app
    restart: always
    working_dir: /var/www/html
    entrypoint: ["/usr/local/bin/sierra-entrypoint"]
    command: ["php-fpm"]
    volumes:
      - ./html:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./html/docker/prod/entrypoint.sh:/usr/local/bin/sierra-entrypoint:ro
    networks: [web]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: &rotated_logging
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  document-worker:
    image: sierra-estoque-app:latest
    container_name: sierra_estoque_document_worker
    restart: always
    working_dir: /var/www/html
    entrypoint: ["/usr/local/bin/sierra-entrypoint"]
    command: ["php", "artisan", "queue:work", "database", "--queue=documents", "--sleep=1", "--tries=3", "--timeout=180", "--max-time=3600"]
    stop_grace_period: 190s
    environment:
      SIERRA_RUNTIME_ROLE: worker
    volumes:
      - ./html:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./html/docker/prod/entrypoint.sh:/usr/local/bin/sierra-entrypoint:ro
    networks: [web]
    healthcheck:
      disable: true
    logging: *rotated_logging

  nginx:
    image: nginx:stable
    container_name: sierra_estoque_nginx
    restart: always
    volumes:
      - ./html:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.sierraestoque.rule=Host(`estoque.sierra.acadsoft.com.br`)"
      - "traefik.http.routers.sierraestoque.entrypoints=websecure"
      - "traefik.http.routers.sierraestoque.tls.certresolver=letsencrypt"
    logging: *rotated_logging

networks:
  web:
    external: true
