log_format sierra_access escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request_id":"$request_id","method":"$request_method","uri":"$uri",'
    '"status":$status,"response_bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64m;

    access_log /dev/stdout sierra_access;
    error_log /dev/stderr warn;

    location ~* ^/(?:\.env(?:\..*)?|\.git(?:/|$)|\.svn(?:/|$)|\.hg(?:/|$)|(?:[^/]+/)*(?:wp-admin|wp-content|wp-includes)(?:/|$)|wp-login\.php$|xmlrpc\.php$|vendor/phpunit(?:/|$)|phpunit(?:/|$)|cgi-bin(?:/|$)) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/api/v1/(?:document-exports/[0-9a-f-]+/download|estoque/transferencias/[0-9]+/pdf|pedidos/[0-9]+/pdf/(?:roteiro|nota-entrega))$ {
        include fastcgi_params;
        fastcgi_pass sierra_estoque_app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffering off;
    }

    location = /index.php {
        internal;
        if ($request_uri ~ "^/index\\.php(?:\\?|$)") { return 404; }
        include fastcgi_params;
        fastcgi_pass sierra_estoque_app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }
}
