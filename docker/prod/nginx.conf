server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location ~* ^/(?:\.env(?:\..*)?|\.git(?:/|$)|\.svn(?:/|$)|\.hg(?:/|$)|wp-admin(?:/|$)|wp-login\.php$|xmlrpc\.php$|vendor/phpunit(?:/|$)|phpunit(?:/|$)|cgi-bin(?:/|$)) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        internal;
        if ($request_uri ~ "^/index\\.php(?:\\?|$)") { return 404; }
        include fastcgi_params;
        fastcgi_pass sierra_estoque_app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }
}
